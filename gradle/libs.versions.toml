[versions]
agp = "8.10.1"
androidx-appcompat = "1.7.1"
androidx-core = "1.16.0"
androidx-test-espresso = "3.6.1"
androidx-test-ext = '1.2.1'
androidx-test-main = "1.6.2"
assertj = '3.27.3'
automattic-publish = "0.10.0"
jna = "5.17.0@aar"
junit = "4.13.2"
kotlin = "2.1.21"
kotlinx-coroutines = '1.10.2'
robolectric = "4.14.1"
terl-lazysodium-android = "5.1.0@aar"
volley = "1.2.1"
wordpress-wellsql = "2.0.0"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext" }
androidx-test-main-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-main" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# TODO: The native library arm64-v8a/libsodium.so (from com.goterl:lazysodium-android:5.1.0) is not 16 KB aligned
terl-lazysodium-android = { module = "com.goterl:lazysodium-android", version.ref = "terl-lazysodium-android" }
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
wordpress-wellsql-main = { group = "org.wordpress", name = "wellsql", version.ref = "wordpress-wellsql" }
wordpress-wellsql-processor = { group = "org.wordpress.wellsql", name = "wellsql-processor", version.ref = "wordpress-wellsql" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
automattic-publish = { id = "com.automattic.android.publish-to-s3", version.ref = "automattic-publish" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
